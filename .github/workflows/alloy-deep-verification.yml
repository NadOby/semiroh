name: Alloy deep verification

# Expensive bounded checks kept out of the routine per-push lane. Scopes are
# not reduced. Runs when the candidate model or a deep entrypoint changes, and
# on manual dispatch. Top-level file classification is enforced by
# alloy-verification.yml.
on:
  workflow_dispatch:

  push:
    branches:
      - research/semantic-core
    paths:
      - formal/core_model.als
      - formal/core_deep.als
      - .github/scripts/AlloyRunner.java
      - .github/workflows/alloy-deep-verification.yml

jobs:
  discover:
    name: Discover deep Alloy commands
    runs-on: ubuntu-latest

    outputs:
      commands: ${{ steps.commands.outputs.commands }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Discover verification commands
        id: commands
        shell: bash
        run: |
          set -euo pipefail

          entrypoints=(
            formal/core_deep.als
          )

          commands='[]'

          for model in "${entrypoints[@]}"; do
            echo "Discovering commands in $model"

            output="$(
              java \
                -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
                commands \
                "$model"
            )"

            printf '%s\n' "$output"

            indices="$(
              printf '%s\n' "$output" \
                | sed -n 's/^[[:space:]]*\([0-9][0-9]*\)[[:space:]]*\..*/\1/p' \
                | jq -Rsc '
                    split("\n")
                    | map(select(length > 0) | tonumber)
                  '
            )"

            if [[ "$indices" == "[]" ]]; then
              echo "No Alloy commands discovered in verification entrypoint: $model" >&2
              exit 1
            fi

            entries="$(
              jq -cn \
                --arg model "$model" \
                --argjson indices "$indices" \
                '$indices | map({
                    model: $model,
                    command: .
                })'
            )"

            commands="$(
              jq -cn \
                --argjson existing "$commands" \
                --argjson added "$entries" \
                '$existing + $added'
            )"
          done

          if [[ "$commands" == "[]" ]]; then
            echo "No Alloy verification commands discovered." >&2
            exit 1
          fi

          echo "commands=$commands" >> "$GITHUB_OUTPUT"

          echo "Discovered verification commands:"
          printf '%s\n' "$commands" | jq .

  verify:
    name: ${{ matrix.case.model }} – command ${{ matrix.case.command }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.discover.outputs.commands) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Compile Alloy runner
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/alloy-runner

          javac \
            -cp "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            -d .build/alloy-runner \
            .github/scripts/AlloyRunner.java

      - name: Run Alloy verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Model: ${{ matrix.case.model }}"
          echo "Command: ${{ matrix.case.command }}"
          echo "Solver: lingeling.parallel"

          java \
            -cp ".build/alloy-runner:$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            AlloyRunner \
            "${{ matrix.case.model }}" \
            "${{ matrix.case.command }}" \
            lingeling.parallel \
            0 \
            4
