name: semantic-model

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lane:
          - core-model
          - language-runtime
          - transform-continuity
          - syntax-reconcile
          - compiler-self-hosting
          - vm-bootstrap
          - cross-boundary
          - mutation

    name: tests (${{ matrix.lane }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ${{ matrix.lane }}
        run: python -m tests.lanes "${{ matrix.lane }}"
