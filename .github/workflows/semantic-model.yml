name: Semantic model

on:
  workflow_dispatch:
    inputs:
      generated_cases:
        description: "Generated cases per participating family; 0 uses ordinary defaults"
        required: false
        default: "0"
      mutation_count:
        description: "Mutation sites per target per batch; 0 skips the heavy mutation campaign"
        required: false
        default: "0"
      mutation_seed:
        description: "Mutation ordering seed"
        required: false
        default: "1"
      mutation_batch:
        description: "Zero-based disjoint mutation batch"
        required: false
        default: "0"

  push:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

  pull_request:
    paths:
      - "shear/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "CHANGES.md"
      - "docs/**"
      - ".github/workflows/semantic-model.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lane:
          - core-model
          - language-runtime
          - transform-continuity
          - syntax-reconcile
          - compiler-self-hosting
          - vm-bootstrap
          - cross-boundary
          - mutation

    name: tests (${{ matrix.lane }})

    env:
      SHEAR_CASES: ${{ inputs.generated_cases || '0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run ${{ matrix.lane }}
        run: python -m tests.lanes "${{ matrix.lane }}"

  mutation-campaign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_count != '' && inputs.mutation_count != '0' }}

    runs-on: ubuntu-latest
    name: mutation campaign (shard ${{ matrix.shard }}/4)

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3

    env:
      SHEAR_MUTATE: ${{ inputs.mutation_count }}
      SHEAR_MUTATE_SEED: ${{ inputs.mutation_seed }}
      SHEAR_MUTATE_BATCH: ${{ inputs.mutation_batch }}
      SHEAR_MUTATE_SHARDS: "4"
      SHEAR_MUTATE_SHARD: ${{ matrix.shard }}
      SHEAR_MUTATION_REPORT: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run mutation batch shard
        run: python -m tests.lanes mutation

      - name: Upload mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-evidence-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}
          path: mutation-report-batch-${{ inputs.mutation_batch }}-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
