name: Transformation verification

on:
  workflow_dispatch:

  push:
    branches:
      - research/semantic-core
    paths:
      - "formal/core_model.als"
      - "formal/transformation_model.als"
      - "formal/transformation.als"
      - "formal/transformation_composition.als"
      - "formal/transformation_associativity.als"
      - ".github/scripts/**"
      - ".github/workflows/transformation.yml"

jobs:
  discover:
    name: Discover Alloy commands
    runs-on: ubuntu-latest

    outputs:
      commands: ${{ steps.commands.outputs.commands }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Discover commands
        id: commands
        shell: bash
        run: |
          set -euo pipefail

          models=(
            "formal/transformation.als"
            "formal/transformation_composition.als"
            "formal/transformation_associativity.als"
          )

          commands='[]'

          for model in "${models[@]}"; do
            if [[ ! -f "$model" ]]; then
              echo "Skipping absent verification model: $model"
              continue
            fi

            echo "Discovering commands in $model"

            output="$(
              java \
                -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
                commands \
                "$model"
            )"

            printf '%s\n' "$output"

            indices="$(
              printf '%s\n' "$output" \
                | sed -n 's/^[[:space:]]*\([0-9][0-9]*\)[[:space:]]*\..*/\1/p' \
                | jq -Rsc '
                    split("\n")
                    | map(select(length > 0) | tonumber)
                  '
            )"

            if [[ "$indices" == "[]" ]]; then
              echo "No Alloy commands discovered in $model." >&2
              exit 1
            fi

            entries="$(
              jq -cn \
                --arg model "$model" \
                --argjson indices "$indices" \
                '$indices | map({
                    model: $model,
                    command: .
                })'
            )"

            commands="$(
              jq -cn \
                --argjson existing "$commands" \
                --argjson added "$entries" \
                '$existing + $added'
            )"
          done

          if [[ "$commands" == "[]" ]]; then
            echo "No Alloy commands discovered." >&2
            exit 1
          fi

          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo "Discovered verification commands:"
          printf '%s\n' "$commands" | jq .

  alloy:
    name: ${{ matrix.case.model }} command ${{ matrix.case.command }} (Glucose instrumented)
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.discover.outputs.commands) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Compile Alloy runner
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/alloy-runner

          javac \
            -cp "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            -d .build/alloy-runner \
            .github/scripts/AlloyRunner.java

      - name: Run Alloy verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Model: ${{ matrix.case.model }}"
          echo "Command: ${{ matrix.case.command }}"

          java \
            -cp ".build/alloy-runner:$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            AlloyRunner \
            "${{ matrix.case.model }}" \
            "${{ matrix.case.command }}" \
            glucose \
            0 \
            4
