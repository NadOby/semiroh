name: Transformation verification

on:
  workflow_dispatch:

  push:
    branches:
      - research/semantic-core
    paths:
      - "formal/core_model.als"
      - "formal/transformation_model.als"
      - "formal/transformation.als"
      - ".github/scripts/**"
      - ".github/workflows/transformation.yml"

jobs:
  discover:
    name: Discover Alloy commands
    runs-on: ubuntu-latest

    outputs:
      commands: ${{ steps.commands.outputs.commands }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Discover commands
        id: commands
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            java \
              -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
              commands \
              formal/transformation.als
          )"

          printf '%s\n' "$output"

          commands="$(
            printf '%s\n' "$output" \
              | sed -n 's/^[[:space:]]*\([0-9][0-9]*\)[[:space:]]*\..*/\1/p' \
              | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)'
          )"

          if [[ "$commands" == "[]" ]]; then
            echo "No Alloy commands discovered." >&2
            exit 1
          fi

          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo "Discovered command indices: $commands"

  alloy:
    name: Transformation command ${{ matrix.command }} (Glucose instrumented)
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(needs.discover.outputs.commands) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Alloy
        id: cache-alloy
        uses: actions/cache@v4
        with:
          path: ~/.cache/shear/alloy-6.2.0
          key: alloy-6.2.0-dist

      - name: Install Alloy
        if: steps.cache-alloy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/shear/alloy-6.2.0"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"

      - name: Check Alloy version
        shell: bash
        run: |
          set -euo pipefail

          java \
            -jar "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            version

      - name: Compile Alloy runner
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/alloy-runner

          javac \
            -cp "$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            -d .build/alloy-runner \
            .github/scripts/AlloyRunner.java

      - name: Run transformation command ${{ matrix.command }} with Glucose
        shell: bash
        run: |
          set -euo pipefail

          java \
            -cp ".build/alloy-runner:$HOME/.cache/shear/alloy-6.2.0/alloy.jar" \
            AlloyRunner \
            formal/transformation.als \
            "${{ matrix.command }}" \
            glucose \
            0 \
            4
