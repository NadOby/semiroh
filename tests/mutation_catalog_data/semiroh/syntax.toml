kind = "constant"
source = "first: bool = True,"
occurrence = 0
classification = "unspecified"
reason = """
The default is used by activate's TARGET = VALUE parser. Changing it to False
only changes how activate() is rejected: instead of the explicit empty-list
diagnostic, target_pair consumes the closing parenthesis and global_function
raises SourceError on that same token. Acceptance and source position are
unchanged; exact diagnostic prose is not specified.
"""

[[survivor]]
kind = "boolean"
source = "if definition is None or code is None:"
occurrence = 0
classification = "equivalent"
reason = """
code is function_at(state, function). function_at returns None exactly when
the entity is absent or its value has no definition; otherwise it returns a
Function or raises while collapsing malformed graph form. Therefore definition
and code cannot reach this guard with only one of them None, so replacing or
with and changes no behaviour.
"""

[[survivor]]
kind = "constant"
source = "mode, template = 2, body[1]"
occurrence = 0
classification = "equivalent"
reason = """
Renderer mode 2 means a literal's template value. Rendering only distinguishes
mode 0, mode 1, and all other mode values: link lookup, local-name checks,
quote/unquote handling, function rendering and literal rendering all take the
same branches for 2 and 3. Changing this internal tag from 2 to 3 therefore
cannot change rendered text or rejection behaviour.
"""
