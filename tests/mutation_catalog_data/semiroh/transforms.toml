reason = """
TransformResult.__post_init__ rejects multiple mapping records for the same
source entity. mapped_entities filters those validated records by source state
and source entity, so a valid TransformResult can contain at most one match.
Changing the ambiguity threshold from greater than 1 to greater than 2 is
therefore unreachable for every valid result.
"""
